{% set name = "wagtail-app-pages" %}
{% set version = "0.3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/wagtail_app_pages-{{ version }}.tar.gz
  sha256: 4eeaeb702c5badc741b802fe3b32ce1504460f43848d1b8d13a603cd4e91c627

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - wagtail >=6.0,<7.3

test:
  imports:
    - wagtail_app_pages
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mwesterhof/wagtail_app_pages
  summary: Full MVC support for wagtail pages
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
